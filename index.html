<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Get in touch with our team using the contact form.">
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page">
    <section class="contact-card" aria-labelledby="form-title">
        <header class="form-header">
            <p class="eyebrow">WE'D LOVE TO HEAR FROM YOU</p>
            <h1 id="form-title">Get in touch</h1>
            <p class="intro">Have a question or need help? Fill out the form below and our team will get back to you.</p>
        </header>
        <form action="#" method="post">
            <div class="form-grid">
                <div class="form-field">
                    <label for="first-name">First name <span>*</span></label>
                    <input type="text" id="first-name" name="first-name" autocomplete="given-name" placeholder="John" required>
                </div>
                <div class="form-field">
                    <label for="last-name">Last name <span>*</span></label>
                    <input type="text" id="last-name" name="last-name" autocomplete="family-name" placeholder="Smith" required>
                </div>
                <div class="form-field">
                    <label for="email">Email address <span>*</span></label>
                    <input type="email" id="email" name="email" autocomplete="email" placeholder="name@example.com" required>
                </div>
                <div class="form-field">
                    <label for="phone">Phone number</label>
                    <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="+84 0123-456-789">
                </div>
                <div class="form-field full-width">
                    <label for="subject">What can we help you with? <span>*</span></label>
                    <select id="subject" name="subject" required>
                        <option value="" selected disabled>Select a topic</option>
                        <option value="general">General question</option>
                        <option value="support">Product support</option>
                        <option value="billing">Billing</option>
                        <option value="partnership">Partnership</option>
                    </select>
                </div>
                <div class="form-field full-width">
                    <label for="message">Message <span>*</span></label>
                    <textarea id="message" name="message" rows="5" placeholder="Tell us a little more about how we can help..." required></textarea>
                </div>
            </div>
            <div class="form-footer">
                <p class="required-note"><span>*</span> Required fields</p>
                <button type="submit">Send message </button>    
            </div>
        </form>
    </section>
</main>
</body>
</html>
